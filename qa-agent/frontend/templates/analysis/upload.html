<!-- frontend/templates/analysis/upload.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Analizar API</title>
  <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">🧠 QA Agent</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2>📤 Cargar Especificación API</h2>
    <p>Soporta: 
      <strong>Swagger/OpenAPI (.yaml, .json)</strong>, 
      <strong>Colecciones Postman (.json)</strong>, 
      <strong>SOAP/WSDL (.xml, .wsdl)</strong>
    </p>

    <form method="POST" action="/analysis/upload" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="file" class="form-label">Seleccionar archivo</label>
        <input type="file" class="form-control" id="file" name="file" 
               accept=".json,.yaml,.yml,.xml,.wsdl" required />
      </div>
      <button type="submit" class="btn btn-primary">Analizar</button>
    </form>

    <a href="/" class="btn btn-link mt-3">← Volver al inicio</a>
  </div>
</body>
</html>
