<!-- frontend/templates/utils/ejecutar_herramienta.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>{{ herramienta.nombre }} - Utilitarios</title>
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">🧠 QA Agent</a>
      <a class="btn btn-outline-light" href="{{ volver_url }}">← Volver</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h3>🛠️ {{ herramienta.nombre }}</h3>

    <!-- Formulario (si es modo entrada) -->
    {% if modo == 'form' %}
    <form method="POST">
      <div class="mb-3">
        <label for="input_data" class="form-label">Datos de entrada</label>
        <textarea class="form-control" id="input_data" name="input_data" rows="5" placeholder="Pega tu JSON, YAML, texto, etc."></textarea>
      </div>
      <div class="mb-3">
        <label for="extra" class="form-label">Parámetro adicional (opcional)</label>
        <input type="text" class="form-control" id="extra" name="extra" />
      </div>
      <button type="submit" class="btn btn-success">Ejecutar</button>
    </form>

    <!-- Resultado (si hay resultado) -->
    {% else %}
    <div class="alert alert-info mt-4">
      <strong>Entrada:</strong><br>
      <pre>{{ entrada }}</pre>
    </div>
    <div class="alert alert-success">
      <strong>Resultado:</strong><br>
      <pre>{{ resultado }}</pre>
    </div>
    <a href="{{ volver_url }}" class="btn btn-secondary">← Volver a utilitarios</a>
    {% endif %}
  </div>
</body>
</html>
